services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_api_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in gtfhrbackend/.env}
      POSTGRES_DB: hr_api_dev
    ports:
      - "5433:5432"
    volumes:
      - hr_api_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_api_dev -d hr_api_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hr_api_postgres:
